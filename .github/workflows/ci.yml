name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Build and test the warehouse on the committed sample in data/sample;
      # the Python tests then read it, including the leakage checks.
      - run: make dbt DBT_TARGET=ci
      - run: make features DBT_TARGET=ci
      - run: uv run pytest
