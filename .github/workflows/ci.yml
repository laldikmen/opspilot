name: CI

on:
  push:
    branches: [main, "v1.*"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Build and test the warehouse on the committed sample in data/sample;
      # the Python tests then read it, including the leakage checks.
      - run: make dbt DBT_TARGET=ci
      - run: make features DBT_TARGET=ci
      - run: uv run pytest
      # The whole pipeline end to end on the sample, with a tiny search. CI writes
      # to its own throwaway checkout; validation stands in for the test set.
      - name: Pipeline smoke test
        env:
          OPSPILOT_DUCKDB_PATH: warehouse/opspilot_ci.duckdb
        run: |
          uv run python -m opspilot.models.baselines
          uv run python -m opspilot.models.train --trials 2
          uv run python -m opspilot.models.evaluate --split validation
          uv run python -m opspilot.models.walk_forward
          uv run python -m opspilot.models.retrain
      - name: API image builds
        run: docker build -f docker/api.Dockerfile -t opspilot-api .
