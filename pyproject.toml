[project]
name = "opspilot-ai"
version = "0.1.0"
description = "Leakage-safe late-delivery prediction on Olist e-commerce orders."
readme = "README.md"
license = "MIT"
authors = [{ name = "İnci Lal Dikmen" }]
requires-python = "==3.11.*"
dependencies = [
    "dbt-duckdb",
    "duckdb",
    "fastapi",
    "kagglehub",
    "matplotlib",
    "mlflow",
    "pandas",
    "pydantic",
    "scikit-learn",
    "shap",
    "uvicorn",
    "xgboost",
]

[dependency-groups]
dev = [
    "httpx",
    "ipykernel",
    "jupyterlab",
    "nbconvert",
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["warehouse/target", "warehouse/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks show values with bare expressions and are allowed long lines.
"notebooks/*.ipynb" = ["B018", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
